<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notifications · Portail Scolarité</title>
<link rel="stylesheet" href="assets/portail.css">
<style>
  .n-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: var(--space-8); align-items: start; }
  .n-group { margin-top: var(--space-6); }
  .n-group:first-child { margin-top: 0; }
  .n-group > .eyebrow { margin-bottom: var(--space-2); }
  .n-list { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius-md); overflow: hidden; }
  .n-item { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: var(--space-3); align-items: start; width: 100%; padding: var(--space-4) var(--space-5); background: transparent; border: 0; border-top: 1px solid var(--border); text-align: left; cursor: pointer; transition: background var(--motion-fast) var(--ease-standard); }
  .n-item:first-child { border-top: 0; }
  .n-item:hover { background: var(--bg); }
  .n-item .dot { width: 8px; height: 8px; margin-top: 8px; border-radius: 50%; }
  .n-item.unread .dot { background: var(--accent); }
  .n-item.unread .n-title { font-weight: 600; }
  .n-title { font-size: 15px; display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
  .n-body { font-size: var(--text-sm); color: var(--muted); margin-top: 2px; line-height: 1.5; }
  .n-meta { font-size: 12px; color: var(--meta); white-space: nowrap; padding-top: 2px; }
  .n-ref { font-family: var(--font-mono); font-size: 12px; color: var(--meta); }
  .channels .switch { border-top: 1px solid var(--border); padding: 6px 0; }
  .channels .switch:first-of-type { border-top: 0; }
  .channels small { display: block; color: var(--meta); font-size: 12px; }
  .empty { padding: var(--space-8); text-align: center; color: var(--muted); }
  @media (max-width: 860px) {
    .n-grid { grid-template-columns: 1fr; }
    .n-item { grid-template-columns: 12px minmax(0, 1fr); padding: var(--space-4); }
    .n-meta { grid-column: 2; padding: 0; }
  }
</style>
</head>
<body>
<header id="s-top"></header>
<main class="s-main" data-od-id="notifications">
  <div class="row-between wrap page-banner" style="margin-bottom:var(--space-6);align-items:center">
    <div><p class="eyebrow">Centre de notifications</p><h1 data-od-id="notifications-title">Notifications</h1></div>
    <button class="btn btn-secondary" id="readall" data-od-id="btn-mark-all-read">Tout marquer comme lu</button>
  </div>
  <div class="n-grid">
    <div>
      <div class="tabs" role="tablist" aria-label="Filtrer" id="tabs" style="margin-bottom:var(--space-5);width:max-content;max-width:100%"></div>
      <div id="groups" data-od-id="notification-list"></div>
    </div>
    <aside class="stack-4">
      <section class="card channels" data-od-id="notification-preferences">
        <h2 style="font-size:20px;margin-bottom:var(--space-2)">Être prévenu·e par</h2>
        <p class="body-sm body-muted" style="margin-bottom:var(--space-3)">À chaque changement de statut ou demande de complément.</p>
        <label class="switch"><span>E-mail<small id="mail"></small></span><input type="checkbox" data-pref="email"></label>
        <label class="switch"><span>SMS<small>Numéro du dossier étudiant</small></span><input type="checkbox" data-pref="sms"></label>
        <label class="switch"><span>Notification Teams / mobile<small>Application de l’université</small></span><input type="checkbox" data-pref="push"></label>
      </section>
      <section class="card" style="background:var(--bg)">
        <p class="eyebrow" style="margin-bottom:6px">Bon à savoir</p>
        <p class="body-sm body-muted">Les notifications sont envoyées automatiquement par le workflow ; le portail les affiche ici même si un e-mail n’arrive pas.</p>
      </section>
    </aside>
  </div>
</main>
<script src="assets/portail.js"></script>
<script>
(function () {
  const $ = s => document.querySelector(s);
  let filter = 'all';
  document.getElementById('mail').textContent = P.ME.email;

  function render() {
    document.querySelectorAll('.s-tabbar').forEach(n => n.remove());
    P.mountStudent('notifs');
    const all = P.state.notifications.slice().sort((a, b) => b.at - a.at);
    const unread = all.filter(n => !n.read).length;
    $('#tabs').innerHTML = [['all', 'Toutes', all.length], ['unread', 'Non lues', unread]].map(([k, l, c]) => '<button class="tab" role="tab" data-filter="' + k + '" aria-selected="' + (k === filter) + '">' + l + ' <span class="count">' + c + '</span></button>').join('');
    $('#readall').disabled = !unread;
    const list = all.filter(n => filter === 'all' || !n.read);
    const startToday = new Date(); startToday.setHours(0, 0, 0, 0);
    const groups = [['Aujourd’hui', n => n.at >= startToday.getTime()], ['Cette semaine', n => n.at < startToday.getTime() && n.at >= startToday.getTime() - 6 * P.DAY], ['Plus ancien', n => n.at < startToday.getTime() - 6 * P.DAY]];
    const html = groups.map(([label, fn]) => {
      const items = list.filter(fn); if (!items.length) return '';
      return '<section class="n-group"><p class="eyebrow">' + label + '</p><div class="n-list">' + items.map(n =>
        '<button class="n-item' + (n.read ? '' : ' unread') + '" data-id="' + n.id + '" data-od-id="notification-' + n.id + '"><span class="dot" aria-hidden="true"></span>' +
        '<span><span class="n-title">' + P.esc(n.title) + ' ' + P.badge(n.kind) + '</span><span class="n-body" style="display:block">' + P.esc(n.body) + '</span><span class="n-ref">' + n.reqId + '</span>' + (n.read ? '' : '<span class="sr-only"> (non lue)</span>') + '</span>' +
        '<span class="n-meta">' + P.fmtRel(n.at) + '</span></button>').join('') + '</div></section>';
    }).join('');
    $('#groups').innerHTML = html || '<div class="card empty">Rien de nouveau. Vous êtes à jour.</div>';
    document.querySelectorAll('[data-pref]').forEach(i => { i.checked = !!P.state.prefs[i.dataset.pref]; });
  }

  document.addEventListener('click', e => {
    const f = e.target.closest('[data-filter]'); if (f) { filter = f.dataset.filter; render(); return; }
    const it = e.target.closest('.n-item');
    if (it) { const n = P.state.notifications.find(x => x.id === it.dataset.id); n.read = true; P.save(); location.href = 'mes-demandes.html?id=' + n.reqId; }
  });
  $('#readall').addEventListener('click', () => { P.state.notifications.forEach(n => n.read = true); P.save(); render(); P.toast('Toutes les notifications sont marquées comme lues.'); });
  document.addEventListener('change', e => {
    const k = e.target.dataset.pref; if (!k) return;
    P.state.prefs[k] = e.target.checked; P.save();
    P.toast((e.target.checked ? 'Activé : ' : 'Désactivé : ') + { email: 'e-mail', sms: 'SMS', push: 'notification Teams / mobile' }[k]);
  });
  P.onExternalChange(render);
  render();
})();
</script>
</body>
</html>
