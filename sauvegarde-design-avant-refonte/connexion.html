<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion · Portail Scolarité</title>
<link rel="stylesheet" href="assets/portail.css">
<style>
  .login-wrap { max-width: 440px; margin: 0 auto; padding: var(--space-12) var(--container-gutter-phone) var(--space-12); }
  .login-wrap h1 { font-size: clamp(30px, 4vw, 40px); margin: 6px 0 var(--space-2); }
  .login-wrap .tabs { margin: var(--space-6) 0 var(--space-5); width: 100%; }
  .login-wrap .tab { flex: 1; justify-content: center; }
  .login-wrap form > .field + .field { margin-top: var(--space-4); }
  .login-wrap .field input { width: 100%; }
  .login-err { margin-top: var(--space-4); font-size: 15px; }
  .login-foot { margin-top: var(--space-5); }
</style>
</head>
<body>
<header class="s-top"><div class="s-top-inner"><a class="brand" href="index.html"><b>Portail Scolarité</b><small>Université — nom à préciser</small></a></div></header>

<main class="login-wrap" data-od-id="login">
  <p class="eyebrow">Connexion</p>
  <h1 data-od-id="login-title">Accédez à votre espace</h1>
  <p class="body-muted">Utilisez le compte fourni par l’université.</p>

  <div class="tabs" role="tablist" aria-label="Espace" id="espaces">
    <button class="tab" role="tab" type="button" data-espace="etudiant" data-od-id="tab-student">Espace étudiant</button>
    <button class="tab" role="tab" type="button" data-espace="agent" data-od-id="tab-agent">Back-office scolarité</button>
  </div>

  <form class="card" id="form" novalidate data-od-id="login-form">
    <div class="field">
      <label for="email">Adresse e-mail</label>
      <input type="email" id="email" autocomplete="username" required maxlength="254" placeholder="prenom.nom@etu.universite.fr">
    </div>
    <div class="field">
      <label for="password">Mot de passe</label>
      <input type="password" class="input" id="password" autocomplete="current-password" required maxlength="200">
    </div>
    <p class="field-error login-err hidden" id="err" role="alert" tabindex="-1"></p>
    <button type="submit" class="btn btn-primary btn-block" id="submit" style="margin-top:var(--space-5)" data-od-id="btn-login">Se connecter</button>
  </form>
  <p class="field-help login-foot">Mot de passe oublié ou compte manquant : contactez la scolarité de votre composante.</p>
</main>

<script>
(function () {
  const $ = s => document.querySelector(s);
  const params = new URLSearchParams(location.search);
  let espace = params.get('espace') === 'agent' ? 'agent' : 'etudiant';
  // Retour uniquement vers une page du portail (pas de redirection ouverte).
  const suite = params.get('suite');
  const target = () => (suite && /^\/[a-z\-]+\.html(\?[^#]*)?$/.test(suite)) ? suite : (espace === 'agent' ? 'file-traitement.html' : 'mes-demandes.html');

  function render() {
    document.querySelectorAll('[data-espace]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.espace === espace)));
    $('#email').placeholder = espace === 'agent' ? 'prenom.nom@universite.fr' : 'prenom.nom@etu.universite.fr';
  }
  function showError(msg) { const e = $('#err'); e.textContent = msg; e.classList.toggle('hidden', !msg); if (msg) e.focus(); }

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-espace]');
    if (b) { espace = b.dataset.espace; showError(''); render(); }
  });
  $('#form').addEventListener('submit', async e => {
    e.preventDefault();
    const email = $('#email').value.trim(), password = $('#password').value;
    if (!email || !password) return showError('Saisissez votre adresse e-mail et votre mot de passe.');
    $('#submit').disabled = true; showError('');
    try {
      const res = await fetch('/api/session', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Espace': espace }, body: JSON.stringify({ email, password, espace }) });
      const json = await res.json().catch(() => ({}));
      if (!res.ok) { showError(json.error || 'Connexion impossible.'); $('#password').value = ''; return; }
      location.href = target();
    } catch (err) {
      showError('Serveur du portail injoignable. Lancez « python serveur/portail.py » puis rechargez la page.');
    } finally { $('#submit').disabled = false; }
  });
  render();
})();
</script>
</body>
</html>
