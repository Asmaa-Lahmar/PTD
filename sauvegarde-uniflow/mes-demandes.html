 const requests=[],notifications=[]; const at=n=>new Date(Date.now()-n*86400000).toISOString();
 const specs=[[0,0,0,1],[0,1,2,4],[0,3,1,3],[0,2,3,8],[0,4,4,12],[0,0,5,17],[1,1,0,7],[1,5,1,5],[1,3,3,9]];

  const r={id:rid,student_id:u.id,student_name:u.name,student_email:u.email,type:TYPES[type],description:['Je souhaite obtenir ce document pour compléter mon dossier administratif.','Je souhaite recevoir le relevé de notes du semestre 5, session 1.','Je sollicite une convention pour mon prochain stage.'][i%3],document:null,submitted_at:at(age),updated_at:at(Math.max(0,age-2)),status:S[status],comment,assigned_id:status?users[2+i%2].id:null,decision_at:status>=3?at(age-2):null,decision_by:status>=3?users[2].id:null,completed_at:status===5?at(age-1):null,history:[{id:id('HIS'),previous_status:null,new_status:S[0],comment:'Demande déposée.',changed_by:u.id,actor:u.name,changed_at:at(age)}]};
  if(status)r.history.push({id:id('HIS'),previous_status:S[0],new_status:S[status],comment,changed_by:users[2].id,actor:users[2].name,changed_at:r.updated_at});
  requests.push(r);if(status)notifications.push({id:id('NOT'),recipient_id:u.id,request_id:rid,message:rid+' : '+S[status]+'. '+comment,created_at:r.updated_at,read:status>2?1:0});
 });

function demoAction(action,d={}){
 const db=demoDB(),u=db.users.find(x=>x.id===sessionStorage.getItem(SESSION)&&x.status==='active');if(!u)throw Error('Session expirée.');
 const admin=u.role==='admin',note=(recipient,rid,message)=>db.notifications.push({id:id('NOT'),recipient_id:recipient,request_id:rid,message,created_at:now(),read:0});
 const hist=(r,old,status,comment)=>r.history.push({id:id('HIS'),request_id:r.id,previous_status:old,new_status:status,comment,changed_by:u.id,actor:u.name,changed_at:now()});let result={ok:true};
 if(action==='create'){
  if(admin||!TYPES.includes(d.type)||d.description.trim().length<10)throw Error('Demande invalide.');const rid=id('UF'),ts=now();
  const r={id:rid,student_id:u.id,student_name:u.name,student_email:u.email,type:d.type,description:d.description.trim(),document:d.document||null,submitted_at:ts,updated_at:ts,status:S[0],comment:'',assigned_id:null,decision_at:null,decision_by:null,completed_at:null,history:[]};hist(r,null,S[0],'Demande déposée.');db.requests.unshift(r);note(u.id,rid,'Votre demande a bien été reçue : '+d.type+'.');db.users.filter(a=>a.role==='admin').forEach(a=>note(a.id,rid,'Nouvelle demande de '+u.name+' : '+d.type+'.'));result={id:rid};
 }else if(action==='read')db.notifications.filter(n=>n.recipient_id===u.id&&(!d.id||d.id===n.id)).forEach(n=>n.read=1);
 else if(action==='profile'){if(d.name.trim().length<2)throw Error('Saisissez votre nom complet.');u.name=d.name.trim();u.photo=d.photo||'';db.requests.filter(r=>r.student_id===u.id).forEach(r=>r.student_name=u.name);}
 else if(action==='logout')sessionStorage.removeItem(SESSION);
 else if(action==='user'){
  if(!admin||d.id===u.id)throw Error('Action non autorisée.');const target=db.users.find(x=>x.id===d.id);if(!target)throw Error('Compte introuvable.');
  if(!['student','admin'].includes(d.role)||!['active','suspended'].includes(d.status))throw Error('Accès invalide.');
  if(d.role!==target.role&&db.requests.some(r=>r.student_id===target.id||r.assigned_id===target.id))throw Error('Ce compte est lié à des demandes : son rôle doit être conservé.');Object.assign(target,{role:d.role,status:d.status});
 }else if(['update','reply'].includes(action)){
  const r=db.requests.find(r=>r.id===d.id);if(!r||(!admin&&r.student_id!==u.id))throw Error('Accès refusé.');const old=r.status;let comment=(d.comment||'').trim();
  if(action==='reply'){
   if(admin||old!==S[2]||!comment)throw Error('Ce complément ne peut pas être envoyé.');r.status=S[1];db.users.filter(a=>a.role==='admin').forEach(a=>note(a.id,r.id,'Complément reçu pour '+r.id+'.'));
  }else{
   if(!admin)throw Error('Accès administrateur requis.');if(d.status!==old&&!NEXT[old].includes(d.status))throw Error('Transition non autorisée.');if(d.status!==old&&[S[2],S[3],S[4]].includes(d.status)&&!comment)throw Error('Ajoutez une explication.');
   if(d.assigned_id&&!db.users.some(a=>a.id===d.assigned_id&&a.role==='admin'&&a.status==='active'))throw Error('Agent invalide.');
   if(!comment&&d.status===old&&(d.assigned_id||null)===r.assigned_id)throw Error('Aucune modification à enregistrer.');
   r.status=d.status;r.assigned_id=d.assigned_id||null;if(comment)r.comment=comment;
   if(old!==r.status&&[S[3],S[4]].includes(r.status)){r.decision_at=now();r.decision_by=u.id;}if(r.status===S[5])r.completed_at=now();
  }
  r.updated_at=now();hist(r,old,r.status,comment||'Affectation mise à jour.');note(r.student_id,r.id,r.id+' : '+r.status+'. '+comment);
 }else throw Error('Action inconnue.');
 try{localStorage.setItem(DEMO_KEY,JSON.stringify(db));}catch{throw Error('Stockage local plein. Réduisez la taille des pièces jointes.');}return Promise.resolve(result);
}

 const user=e.target.closest('[data-edit-user]');if(user){const u=state.users.find(x=>x.id===user.dataset.editUser);confirmDialog('Gérer l’accès de '+esc(u.name),'<div class="stack"><p class="tiny">'+esc(u.email)+'</p><div class="field"><label for="edit-role">Rôle</label><select id="edit-role"><option value="student"'+(u.role==='student'?' selected':'')+'>Étudiant</option><option value="admin"'+(u.role==='admin'?' selected':'')+'>Administrateur / Personnel de scolarité</option></select></div><div class="field"><label for="edit-account">Statut du compte</label><select id="edit-account"><option value="active"'+(u.status==='active'?' selected':'')+'>Actif</option><option value="suspended"'+(u.status==='suspended'?' selected':'')+'>Suspendu</option></select></div><p class="tiny">Les sessions du compte seront révoquées. Les rôles des comptes liés à des demandes ne peuvent pas être changés.</p></div>','Enregistrer l’accès',async()=>{await api('user',{id:u.id,role:$('#edit-role').value,status:$('#edit-account').value});$('#detail-dialog').close();await refresh('Accès utilisateur mis à jour.');});return;}
 const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;
 try{
  if(action==='menu'||action==='menu-close'){const opened=$('.app').classList.toggle('menu-open',action==='menu');$('.menu-toggle').setAttribute('aria-expanded',String(opened));}
  if(action==='close-dialog')$('#detail-dialog').close();
  if(action==='logout'){e.preventDefault();await api('logout');sessionStorage.removeItem(SESSION);location.href='index.html';}
  if(action==='clear-filters'){document.querySelectorAll('.filters input,.filters select').forEach(i=>i.value='');updateResults();}
  if(action==='read-all'){await api('read');await refresh('Toutes les notifications sont marquées comme lues.');}
  if(action==='all-notifs'||action==='unread-notifs'){unreadOnly=action==='unread-notifs';notificationsPage();}
  if(action==='remove-photo'){profilePhoto='';$('#profile-photo').value='';toast('Photo retirée. Enregistrez pour confirmer.');}
  if(action==='download-attachment'){const doc=state.requests.find(r=>r.id===selected)?.document;if(!doc)throw Error('Justificatif introuvable.');const res=await fetch(doc.data),blob=await res.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=doc.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
 }catch(err){error(err.message);}
});
document.addEventListener('input',e=>{if(e.target.closest('.filters'))updateResults();if(e.target.id==='users-search')renderUsers();});
document.addEventListener('change',async e=>{if(e.target.closest('.filters'))updateResults();if(e.target.id==='request-file')$('#file-feedback').textContent=e.target.files[0]?.name||'';if(e.target.id==='profile-photo'){try{const file=await readFile(e.target.files[0],1024*1024,['image/png','image/jpeg','image/webp']);if(file)profilePhoto=file.data;}catch(err){$('#profile-error').textContent=err.message;e.target.value='';}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('.app.menu-open')){$('.app').classList.remove('menu-open');$('.menu-toggle')?.setAttribute('aria-expanded','false');}});
async function boot(){
 if(page==='login'){await initLogin();inspectable();return;}
 try{mode=sessionStorage.getItem(SESSION)?'demo':'server';await loadState();const admin=state.user.role==='admin';if(ADMIN.includes(page)&&!admin){location.replace(paths.dashboard);return;}if(['dashboard','new','requests'].includes(page)&&admin){location.replace(paths.admin);return;}render();const rid=new URLSearchParams(location.search).get('id');if(rid)openRequest(rid);
  refreshTimer=setInterval(async()=>{if(document.hidden||$('#detail-dialog')?.open||['new','profile','users'].includes(page))return;try{const old=JSON.stringify(state);await loadState();if(old!==JSON.stringify(state)){const filters={};document.querySelectorAll('.filters input,.filters select').forEach(el=>filters[el.id]=el.value);render();Object.entries(filters).forEach(([k,v])=>{if(document.getElementById(k))document.getElementById(k).value=v;});if($('#result-count'))updateResults();}}catch{clearInterval(refreshTimer);toast('Session expirée. Reconnectez-vous.');location.href='index.html';}},15000);
 }catch{sessionStorage.removeItem(SESSION);location.replace('index.html');}
}
window.UniFlow={TYPES,S,NEXT,demoSeed,demoState,demoAction,boot};
boot();
})();
